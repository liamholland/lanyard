<!DOCTYPE html>
<html>
<head>
    <title>Lanyard</title>
</head>
<body>
    <h1>Countdown to Start Time</h1>
    <p id="timer">Loading...</p>
    <p id="status">Ready</p>

    <script src="./partyTime.js"></script>
    <script src="./gamelist.js"></script>
    <script src="./identity.js"></script>
    <script type="module">
        let registerDiv = document.getElementById("register-section");
        let regStatus = document.getElementById("register-status");
        registerDiv.style.display = 'none';

        getStartTime().then(startTime => {
            const timerElement = document.getElementById('timer');
            setInterval(() => timerElement.textContent = formattedCountdown(startTime), 1000);
        });
        createUserId();
        retrieveUsername().then(res => {
            if (res.length > 0) {
                regStatus.textContent = `welcome back ${res}`;
            } else {
                regStatus.textContent = "enter a username below to register";
                registerDiv.style.display = "block";
            }
        }).catch(e => {
            regStatus.textContent = "enter a username below to register";
            registerDiv.style.display = "block";
        });
    </script>

    <p id="register-status">Loading...</p>
    <div id="register-section">
        <input type="text" id="username-entry"/>
        <button id="register-button">register</button><br>
    </div>

    <input type="datetime-local" id="time-picker"/><br>
    <button id="departure-setter">set departure time</button><br>
    <button id="num-people-getter">query player numbers</button><br>

    <input type="file" id="file-picker" name="fileList" webkitdirectory multiple />
    <pre id="result"></pre>

    <script>
        let preResolvedGames = retrieveResolvedGames();
        if (preResolvedGames !== null) {
            const resultElement = document.getElementById('result');
            resultElement.textContent = JSON.stringify(preResolvedGames, null, 2);
        }

        document.getElementById("file-picker").addEventListener("click", (event) => {
            const statusElement = document.getElementById('status');
            statusElement.textContent = "scanning...";
        });

        document.getElementById("file-picker").addEventListener("change", (event) => {
            const statusElement = document.getElementById('status');
            const resultElement = document.getElementById('result');
            let sizeMap = aggregateGames(event.target.files);
            statusElement.textContent = "scan complete";
            event.target.value = '';
            resolveGames(sizeMap, retrieveResolvedGames()).then(res => {
                resultElement.textContent = JSON.stringify(res, null, 2);
                persistResolvedGames(res);
            });
        });

        document.getElementById("departure-setter").addEventListener("click", (event) => {
            let cal = document.getElementById("time-picker");
            let posixTime = posixTimeFromDate(cal.value);
            addDepartureTime(posixTime).then(res => {
                console.log('uploaded time: ', posixTime);
            });
        });

        document.getElementById("num-people-getter").addEventListener("click", (event) => {
            let cal = document.getElementById("time-picker");
            let posixTime = posixTimeFromDate(cal.value);
            getNumPlayers(posixTime).then(res => {
                const resultElement = document.getElementById('result');
                resultElement.textContent = `there will be ${res} players at ${cal.value}`;
            });
        });

        document.getElementById("register-button").addEventListener("click", (event) => {
            let textBox = document.getElementById("username-entry");
            let username = textBox.value;
            registerUsername(username).then(res => {
                let regSec = document.getElementById("register-section");
                regSec.style.display = "none";
                let regStatus = document.getElementById("register-status");
                regStatus.textContent = `welcome ${username}`;
                console.log("registered username: ", username);
            });
        });
    </script>
</body>
</html>
